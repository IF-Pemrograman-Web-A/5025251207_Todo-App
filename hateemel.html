<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
    <link rel="stylesheet" href="cantik.css">
</head>

<body>
    <header>
        <h1>MY TODO LIST</h1>
        <p>by Kezia 5025251207</p>
    </header>

    <main>
        <section class="todo">
            <h2>Todo List</h2>

            <div class="item">
                <input type="checkbox">
                <div>
                    <h3>Resume Jarkom</h3>
                    <p>Today</p>
                </div>
            </div>

            <div class="item">
                <input type="checkbox">
                <div>
                    <h3>Kelas PWeb </h3>
                    <p>Tomorrow</p>
                </div>
            </div>

            <div class="item">
                <input type="checkbox">
                <div>
                    <h3>Quiz KPPL</h3>
                    <p>Friday</p>
                </div>
            </div>
        </section>


        <section class="detail">
            <h2>Todo Detail</h2>

            <h3>Submit Jarkom</h3>
            <p>
            Kirim resume ke email Bapak Roy
            </p>

            <p><b>Due:</b> Today</p>
            <p><b>Status:</b> Not completed</p>

            <button>Complete</button>
        </section>

    </main>


    <aside>
        <h2>Add New</h2>

        <form>
            <label>Todo:</label>
            <input type="text" placeholder="Insert todo">

            <label>Description:</label>
            <textarea placeholder="Description"></textarea>

            <label>Due Date:</label>
            <input type="date">

            <button type="submit">Add Todo</button>

        </form>
    </aside>

</body>
</html>
