<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Todo List</title>
    <link rel="stylesheet" href="cantik.css">
</head>

<body>
    <header>
        <h1>MY TODO LIST</h1>
        <p>by Kezia 5025251207</p>
        <button id="darkModeButton">Toggle Dark/Light Mode</button>
    </header>

    <main>
        <section class="todo">
            <h2>Todo List</h2>

        <div id = "TodoList">

            <div class="item">
                <input type="checkbox">
                <div>
                    <h3>Resume Jarkom</h3>
                    <p>Today</p>
                </div>
            </div>

            <div class="item">
                <input type="checkbox">
                <div>
                    <h3>Kelas PWeb </h3>
                    <p>Tomorrow</p>
                </div>
            </div>

            <div class="item">
                <input type="checkbox">
                <div>
                    <h3>Quiz KPPL</h3>
                    <p>Friday</p>
                </div>
            </div>

        </div>
        </section>


        <section class="detail">
            <h2>Todo Detail</h2>

            <h3 id="detailTitle"> Select Todo</h3>
            <p id="detailDesc">
            Pilih TODO di sebelah kiri untuk melihat detailnya
            </p>

            <p><b>Due:</b> <span id="detailDue">-</span></p>
            <p><b>Status:</b> <span id="detailStatus">-</span></p>

            <button id="complete">Complete</button>
        </section>

    </main>


    <aside>
        <h2>Add New</h2>

        <form id = "newtodo">
            <label>Todo:</label>
            <input type="text" id="todoinput" placeholder="Insert todo">

            <label>Description:</label>
            <textarea id="description" placeholder="Description"></textarea>

            <label>Due Date:</label>
            <input type="date" id="date">

            <button type="submit">Add Todo</button>

        </form>
    </aside>
    <script src="interaction.js"></script>
</body>
</html>
