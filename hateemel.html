<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Todo List</title>
    <link rel="stylesheet" href="cantik.css">
</head>

<body>
    <header>
        <h1>MY TODO LIST</h1>
        <p>by Kezia 5025251207</p>
        <button id="darkModeButton" type="button" aria-label="Toggle Dark/Light Mode">Dark/Light Mode</button>
    </header>

<main role="main">
        <section class="todo" aria-labelledby="todo-heading">
            <h2 id="todo-heading">Todo List</h2>
            <div id="TodoList" role="region" aria-live="polite" aria-label="Daftar Tugas"></div>
        </section>
    
        <section class="detail" aria-labelledby="detail-heading">
            <h2 id="detail-heading">Todo Detail</h2>

            <h3 id="detailTitle">Select Todo</h3>
            <p id="detailDesc">Pilih TODO di sebelah kiri untuk melihat detailnya</p>

            <p><b>Due:</b> <span id="detailDue">-</span></p>

        <p><b>Notification Time:</b> <span id="detailNotifTime">-</span></p>
            <p><b>Status:</b> <span id="detailStatus">-</span></p>
            <div id="detailImageContainer" style="margin-top: 10px;"></div>

            <button id="complete" type="button">Complete</button>
            
        </section>

    </main>


    <aside role="complementary" aria-labelledby="add-heading">

        <h2 id="add-heading">Add New</h2>

        <form id = "newtodo" role="form" aria-label="Form Tambah Todo">
            <label for="todoinput">Todo:</label>
            <input type="text" id="todoinput" placeholder="Insert todo" required aria-required="true">

            <label for="description">Description:</label>
            <textarea id="description" placeholder="Description"></textarea>

            <label for="date">Due Date:</label>
            <input type="date" id="date">

            <label for="todoImage">Capture / Upload Image:</label>
            <input type="file" id="todoImage" accept="image/*" capture="environment">
            <label for="notifTime">Notification Time:</label>
            <input type="time" id="notifTime">


            <button type="submit">Add Todo</button>

        </form>
    </aside>
    <script src="interaction.js"></script>
</body>
</html>
